name: package-windows

# Windows x64 ZIPs for PostgreSQL 17 and 18, built with MSVC against an EDB installation and exercised
# with install.ps1 (offline manifest) on the same runner.
on:
  workflow_dispatch:
  workflow_call:

jobs:
  build-and-test:
    name: zip windows x64 pg${{ matrix.pgmajor }}
    strategy:
      fail-fast: false
      matrix:
        pgmajor: [17, 18]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL ${{ matrix.pgmajor }} (EDB build via Chocolatey)
        shell: pwsh
        run: |
          $major = ${{ matrix.pgmajor }}
          # The runner image ships one PostgreSQL major preinstalled (own data dir, password "root", port 5432).
          # Stop everything, install the target major only if absent, and set a password we control.
          Get-Service postgresql* | ForEach-Object { Stop-Service $_.Name -Force -ErrorAction SilentlyContinue; Set-Service $_.Name -StartupType Disabled }
          $root = "C:\Program Files\PostgreSQL\$major"
          if (-not (Test-Path "$root\bin\pg_config.exe")) { choco install postgresql$major --params '/Password:aavtest /Port:5432' -y --no-progress }
          if (-not (Test-Path "$root\include\server\postgres.h")) { throw 'server headers missing: the EDB package did not install the development files' }
          $svc = Get-CimInstance Win32_Service | Where-Object { $_.Name -eq "postgresql-x64-$major" }
          if (-not $svc) { throw "service postgresql-x64-$major not found" }
          $data = [regex]::Match($svc.PathName, '-D\s+"([^"]+)"').Groups[1].Value
          Write-Host "service $($svc.Name) data=$data"
          Set-Service $svc.Name -StartupType Manual
          Stop-Service $svc.Name -Force -ErrorAction SilentlyContinue
          $hba = Join-Path $data 'pg_hba.conf'
          $orig = Get-Content -Raw $hba
          ("host all all 127.0.0.1/32 trust`nhost all all ::1/128 trust`n" + $orig) | Set-Content $hba -NoNewline
          Start-Service $svc.Name
          & "$root\bin\pg_isready.exe" -h localhost -p 5432 -t 30
          & "$root\bin\psql.exe" -X -h localhost -p 5432 -U postgres -d postgres -w -c "ALTER USER postgres PASSWORD 'aavtest'"
          if ($LASTEXITCODE -ne 0) { throw 'could not set the postgres password' }
          $orig | Set-Content $hba -NoNewline
          # Works whether the trust lines are still in effect or password auth already applies.
          $env:PGPASSWORD = 'aavtest'
          & "$root\bin\psql.exe" -X -h localhost -p 5432 -U postgres -d postgres -w -c 'SELECT pg_reload_conf()'
          if ($LASTEXITCODE -ne 0) { throw 'reload after restoring pg_hba.conf failed' }
          & "$root\bin\psql.exe" -X -h localhost -p 5432 -U postgres -d postgres -w -c 'SELECT 1'
          if ($LASTEXITCODE -ne 0) { throw 'password authentication with the CI password failed' }
          Get-Service postgresql* | Format-Table Name, Status, StartType -AutoSize
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build DLL
        shell: cmd
        run: windows\build_windows.bat "C:\Program Files\PostgreSQL\${{ matrix.pgmajor }}"
      - name: Build ZIP
        shell: pwsh
        run: |
          $info = .\packaging\windows\build-zip.ps1 -PgMajor ${{ matrix.pgmajor }}
          $info | Format-List | Out-String | Write-Host
          "ZIP_SHA=$($info.sha256)" >> $env:GITHUB_ENV
          "EXT_VERSION=$($info.extension_version)" >> $env:GITHUB_ENV
      - name: Offline install through install.ps1, doctor, Pester live suite
        shell: pwsh
        run: |
          $pgpass = Join-Path $env:RUNNER_TEMP 'pgpass.conf'
          [IO.File]::WriteAllText($pgpass, "localhost:5432:*:postgres:aavtest`n", (New-Object Text.UTF8Encoding $false))
          $zip = Get-ChildItem dist -Filter '*.zip' | Select-Object -First 1
          $m = [ordered]@{ schema_version = 1; extension_version = $env:EXT_VERSION; package_revision = 1; minimum_installer_version = '1.2.0'; published_at = (Get-Date).ToUniversalTime().ToString('o')
                           artifacts = @([ordered]@{ artifact_filename = $zip.Name; artifact_url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/v$env:EXT_VERSION/$($zip.Name)"; sha256 = $env:ZIP_SHA; postgres_major = ${{ matrix.pgmajor }}; operating_system = 'windows'; architecture = 'x64'; package_type = 'zip' }) }
          $m | ConvertTo-Json -Depth 5 | Set-Content dist\release-manifest.json
          & 'C:\Program Files\PostgreSQL\${{ matrix.pgmajor }}\bin\psql.exe' -X -h localhost -U postgres -d postgres -c 'CREATE DATABASE aav_installer_test' -w
          .\packaging\windows\install.ps1 -Check -Manifest dist\release-manifest.json -ArtifactDir dist -PgPassFile $pgpass
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\packaging\windows\install.ps1 -Yes -Manifest dist\release-manifest.json -ArtifactDir dist -PgPassFile $pgpass -ControlDatabase aav_installer_test -ServiceName postgresql-x64-${{ matrix.pgmajor }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Install-Module Pester -MinimumVersion 5.0 -Force -Scope CurrentUser -SkipPublisherCheck
          $env:AAV_TEST_LIVE = '1'; $env:AAV_TEST_PGPASSFILE = $pgpass; $env:AAV_TEST_DATABASE = 'aav_installer_test'; $env:AAV_TEST_SERVICE = 'postgresql-x64-${{ matrix.pgmajor }}'
          Invoke-Pester -Path test/installer/windows-install.Tests.ps1 -CI
        env:
          PGPASSWORD: aavtest
      - uses: actions/upload-artifact@v4
        with:
          name: zip-windows-x64-pg${{ matrix.pgmajor }}
          path: dist/*.zip
          if-no-files-found: error
