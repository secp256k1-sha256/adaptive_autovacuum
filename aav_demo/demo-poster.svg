<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d">
  <title id="t">Watch the adaptive_autovacuum demo</title>
  <desc id="d">Five-minute recording: PostgreSQL autovacuum tuning itself under a pgbench update storm, watched live from psql.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#1b2a44"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#336791" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#336791" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f8fc0"/>
      <stop offset="1" stop-color="#336791"/>
    </linearGradient>
    <clipPath id="card"><rect x="0" y="0" width="1280" height="720" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect x="0" y="0" width="1280" height="720" fill="url(#bg)"/>
    <circle cx="1120" cy="80" r="420" fill="url(#glow)"/>
    <circle cx="200" cy="640" r="300" fill="url(#glow)" opacity="0.6"/>
    <g stroke="#ffffff" stroke-opacity="0.04">
      <path d="M0 120H1280M0 240H1280M0 360H1280M0 480H1280M0 600H1280"/>
      <path d="M160 0V720M320 0V720M480 0V720M640 0V720M800 0V720M960 0V720M1120 0V720"/>
    </g>
  </g>
  <rect x="1" y="1" width="1278" height="718" rx="28" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>

  <!-- play button -->
  <g transform="translate(200 318)">
    <circle r="118" fill="#ffffff" fill-opacity="0.06"/>
    <circle r="96" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
    <circle r="72" fill="url(#play)"/>
    <path d="M-20 -38 L40 0 L-20 38 Z" fill="#ffffff"/>
  </g>

  <!-- copy -->
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#ffffff">
    <text x="340" y="212" font-family="Consolas, 'SFMono-Regular', Menlo, monospace" font-size="21" letter-spacing="3" fill="#7dd3fc">ADAPTIVE_AUTOVACUUM · DEMO</text>
    <text x="340" y="292" font-size="62" font-weight="700">Watch autovacuum</text>
    <text x="340" y="360" font-size="62" font-weight="700">tune itself.</text>
    <text x="340" y="412" font-size="26" fill="#cbd5e1">Five minutes on Windows: 100 hot tables under an 8-client</text>
    <text x="340" y="448" font-size="26" fill="#cbd5e1">pgbench update storm, watched live from psql.</text>

    <!-- pills -->
    <g font-size="21" font-weight="600">
      <rect x="340" y="478" width="118" height="42" rx="21" fill="#336791"/>
      <path d="M362 490 L376 499 L362 508 Z" fill="#ffffff"/>
      <text x="386" y="507">5:02</text>

      <rect x="472" y="478" width="300" height="42" rx="21" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="622" y="507" text-anchor="middle" fill="#e2e8f0">Windows · psql · pgbench</text>

      <rect x="786" y="478" width="330" height="42" rx="21" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="951" y="507" text-anchor="middle" fill="#e2e8f0">100 tables · 10M rows · 8 clients</text>
    </g>
  </g>

  <!-- terminal strip -->
  <g>
    <rect x="60" y="548" width="1160" height="132" rx="14" fill="#020617" stroke="#ffffff" stroke-opacity="0.10"/>
    <circle cx="86" cy="572" r="6" fill="#ff5f57"/>
    <circle cx="106" cy="572" r="6" fill="#febc2e"/>
    <circle cx="126" cy="572" r="6" fill="#28c840"/>
    <g font-family="Consolas, 'SFMono-Regular', Menlo, monospace" font-size="20" fill="#e2e8f0">
      <text x="86" y="606"><tspan fill="#7dd3fc">PS&gt;</tspan> psql -X -d mydb -f seed.sql <tspan fill="#64748b">-- 100 tables x 100k rows, early-firing thresholds</tspan></text>
      <text x="86" y="636"><tspan fill="#7dd3fc">PS&gt;</tspan> pgbench -n -d mydb -f worker_load.sql -c 8 -j 8 -T 180 -P 15</text>
      <text x="86" y="666"><tspan fill="#7dd3fc">PS&gt;</tspan> psql -X -d mydb -f aav_watch.sql <tspan fill="#64748b">-- cost pair · workers · naptime · backlog, every 5 s</tspan></text>
    </g>
  </g>
</svg>
